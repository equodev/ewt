.gcs_upload:
  image: google/cloud-sdk:latest
  variables:
    GCS_BUCKET: "gs://equo-ewt"
    FOLDER_TO_UPLOAD: "ewt.api/build/libs"
    GCS_PREFIX: "ewt.api"
  before_script:
    - echo ${service_account} | base64 -d > gcp-key.json
    - gcloud auth activate-service-account --key-file=gcp-key.json
  script:
    # RELEASE_NEXT comes from ewt_build's dotenv artifact; fail fast if it didn't propagate.
    - test -n "$RELEASE_NEXT"
    # Immutable per-version folder: gs://equo-ewt/ewt.api/<version>/ewt.api-<version>-<os>.jar
    - gsutil -m -h "Cache-Control:public, max-age=3600" cp -r $FOLDER_TO_UPLOAD/* "$GCS_BUCKET/$GCS_PREFIX/$RELEASE_NEXT/"
    # Rolling "latest" pointer with -latest- filenames so consumers can hardcode the URL.
    - for os in linux macos windows; do gsutil -h "Cache-Control:no-cache" cp "$FOLDER_TO_UPLOAD/ewt.api-$RELEASE_NEXT-$os.jar" "$GCS_BUCKET/$GCS_PREFIX/latest/ewt.api-latest-$os.jar"; done

# Downloads Flutter SDK and enables macOS desktop support.
# The widgets plugin uses SPM — no CocoaPods needed.
.flutter:macos:
  tags: [vm-runner]
  variables:
    RUNNER_OS: "mac"
    RUNNER_OS_VERSION: "sq-x26-8cores-16ram"
  before_script:
    - curl -L "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_${FLUTTER_SDK}-stable.zip" -o flutter.zip && unzip -q flutter.zip -d $HOME
    - export PATH="$HOME/flutter/bin:${PATH}"
    - flutter config --enable-macos-desktop

# Windows runner uses the prebuilt vs2022-fl47-j21 VM image (terraform-kubernetes!105): Flutter
# 3.47.5 is already installed at C:\flutter and VS 2022 Build Tools (VC workload) are preloaded,
# so the before_script no longer downloads them — cuts the job from ~20 min to ~5 min.
# Runner shell is bash (Git Bash). Flutter commands run via powershell.exe -C "..." with PATH set.
.flutter:windows:
  tags: [vm-runner]
  variables:
    RUNNER_OS: "win"
    RUNNER_OS_VERSION: "vs2022-fl47-j21-8cores-32ram"
    ErrorActionPreference: stop
  before_script:
    - powershell.exe -C "\$env:PATH='c:\\flutter\\bin;' + \$env:PATH; flutter config --enable-windows-desktop"
