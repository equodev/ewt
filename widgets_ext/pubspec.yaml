name: widgets_ext
description: "EWT wrappers around third-party pub.dev widget packages, exposing flat marshalable APIs so they generate across Java / FFM / comm-web."
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.6.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  # Third-party, 100% pure-Dart map client (renders on Flutter's canvas — no native
  # platform views), so it generates across Java / FFM / comm-web like the rest of EWT.
  flutter_map: ^8.1.0
  latlong2: ^0.9.1

flutter:
  uses-material-design: true
