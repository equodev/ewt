stages:
  - docker_build
  - check
  - flutter
  - test
  - build
  - deploy
  - release

# --- Release cadence model (mirrors swt-flutter) ---
# Push to main  → ONLY mark_release_needed runs (sets NEED_RELEASE=true).
#                 The release chain is available behind the manual release_gate button.
# Daily schedule → pipeline created ONLY when NEED_RELEASE == "true"; full chain runs automatically.
# Merge requests → release_gate is absent; flutter + build jobs run normally.
workflow:
  rules:
    # Evolve-release rebuild (ewt#62): swt-flutter's release triggers us as a multi-project pipeline
    # (source "pipeline") to republish the p2 against the just-released Evolve. Keyed on the source:
    # EWT has no other multi-project parent. The trigger sends only EVOLVE_RELEASE_* (see
    # resolve_evolve_ref and ewt_evolve_p2), none of swt-flutter's globals. Must precede the
    # default-branch rule below: the trigger runs on `main`, but we do NOT want MARK_PIPELINE (this
    # is a rebuild, not a pending-release marker). The p2 chain runs via release_gate +
    # publish_ewt_evolve_p2.
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        MARK_PIPELINE: "true"

include:
  - '/.ci/shared-templates.yml'

variables:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.console=plain
    -Dorg.gradle.vfs.watch=false
  # Anchor GRADLE_USER_HOME inside the project dir so the GitLab `cache:` block
  # below (which can only cache paths under $CI_PROJECT_DIR) picks up the
  # wrapper distribution (~gradle-8.10.2-bin.zip, ~6-7 min cold download on
  # services.gradle.org) and the dependency cache across jobs and pipelines.
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  FLUTTER_SDK: "3.47.5"
  FLUTTER_IMAGE_TAG: $CI_REGISTRY_IMAGE/jdk22.flutter:linux
  JEXTRACT_URL: "https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
  # --- EWT ↔ Evolve integration (ewt-evolve jar) ---
  # The combined bundle merges Evolve's Dart (swtflutter) with EWT's into ONE snapshot, so the
  # ewt-evolve jar is tied to a SPECIFIC swt-evolve version: the consumer must run that same
  # swt-evolve jar at runtime. By DEFAULT we FOLLOW the LATEST swt-evolve GitHub release: the
  # resolve_evolve_ref job picks the highest v* tag ONCE per pipeline and exports it as EVOLVE_REF
  # (dotenv), so all three ewt_evolve_build:* jobs (linux/macos/windows) bake the IDENTICAL Evolve
  # version even if a new release lands mid-pipeline. The release tags live on GitHub
  # (equodev/swt-evolve), NOT the GitLab dev repo (which carries different versioning), so CI clones
  # GitHub below.
  # An Evolve-release rebuild instead builds the commit and pins the version that release names
  # (EVOLVE_RELEASE_SHA / EVOLVE_RELEASE_VERSION), since a release of non-default SWT versions moves
  # no tag. (No hardcoded EVOLVE_REF here — resolve_evolve_ref sets it. To pin/override, run the pipeline with
  # EVOLVE_REF set as a variable to a release tag (v0.330.0), a branch (main) or a commit SHA:
  # resolve_evolve_ref honors it and skips the latest-tag lookup. This unblocks an EWT build against
  # an unreleased swt-evolve fix — no need to wait for a release to cut a new v* tag. For a non-tag ref
  # (branch/SHA) the p2 publish pins feat.hybrid to the published host version instead of the ref:
  # EVOLVE_PIN_VERSION if set, else the highest feat.hybrid at VERIFY_P2_URL — see ewt_evolve_p2.)
  # Public GitHub repo that publishes swt-evolve releases — cloned anonymously over HTTPS (no
  # token, no allowlist). Also a full source mirror (flutter-lib + swt_native), so it builds.
  EVOLVE_PROJECT_PATH: "equodev/swt-evolve"

# Shared Gradle cache for every job that runs `./gradlew`. Keyed on the
# wrapper properties file so a Gradle version bump auto-invalidates. Jobs
# that don't run gradle (docker build, alpine curl helpers) inherit this
# but never touch it — the cache upload is a no-op when the paths are empty.
.gradle_cache: &gradle_cache
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
  paths:
    - .gradle/wrapper/
    - .gradle/caches/
  policy: pull-push

build_docker_image:
  stage: docker_build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    # Never on an Evolve-release rebuild (ewt#62 — source "pipeline"): a rebuild republishes the p2,
    # it does not touch the CI image, and a triggered pipeline has no credentials to push it. Without
    # this, a rebuild landing on a commit that changed .gitlab-ci.yml/Dockerfile would match the
    # default-branch rule below and fail trying to push the image.
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
      when: never
    - if: '$CI_IMAGE'
    # Rebuild the image inside MRs that change the Dockerfile OR the Flutter
    # version (FLUTTER_SDK lives in this file and is baked into the image at build
    # time), so the MR validates the image (and bootstraps a new tag) instead of
    # failing to pull a tag that only main would ever build — or silently running
    # on a stale Flutter version.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths:
          - .docker/Dockerfile
          - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        paths:
          - .docker/Dockerfile
          - .gitlab-ci.yml
        compare_to: $CI_COMMIT_SHA^
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --provenance=false --sbom=false --pull --build-arg FLUTTER_VERSION=$FLUTTER_SDK --build-arg JEXTRACT_URL=$JEXTRACT_URL -f .docker/Dockerfile -t "$FLUTTER_IMAGE_TAG" .
    - docker push "$FLUTTER_IMAGE_TAG"

# Runs on every push to main. Records that a release is pending so the next
# scheduled run triggers the full release chain.
mark_release_needed:
  stage: check
  image: alpine/curl:latest
  needs: []
  variables:
    GIT_STRATEGY: none
  script:
    - 'curl -sf --request PUT --header "PRIVATE-TOKEN: $GITLAB_PRIVATE_TOKEN"
       "$CI_API_V4_URL/projects/${CI_PROJECT_ID}/variables/NEED_RELEASE"
       --form "value=true"'
  rules:
    - if: '$MARK_PIPELINE == "true"'

# Manual button on master pipelines. Clicking it unblocks the flutter/build chain
# so the full release runs in THIS pipeline instead of waiting for the next schedule.
# On scheduled release pipelines this job is absent and the chain runs automatically.
release_gate:
  stage: check
  image: alpine:latest
  needs: []
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Release gate opened — running the release chain in this pipeline."
  rules:
    # On an Evolve-release rebuild (ewt#62 — source "pipeline", triggered by swt-flutter) the gate
    # opens automatically: no human clicks it, and the build chain (generate → tests →
    # ewt_evolve_build[:*] → ewt_evolve_p2) must run so the p2 is reassembled against the new Evolve.
    # The release-only jobs stay gated by their own rules.
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$MARK_PIPELINE == "true"'
      when: manual
      allow_failure: true

# Regenerates all gitignored monolithic artifacts from generation_index.dart.
# flutter:* and ewt_build download these artifacts via `needs` so they never
# need the generator toolchain themselves (critical for macOS/Windows VM runners).
generate:
  stage: flutter
  image: $FLUTTER_IMAGE_TAG
  cache: *gradle_cache
  needs:
    - job: build_docker_image
      optional: true
    - job: release_gate
      optional: true
  script:
    # subwidgets.dart is gitignored but imported by generation_index.dart; the pregeneration
    # step that writes it is cached against pregeneration_index.dart.ts. Delete the cache so
    # it always regenerates subwidgets.dart before the main generator run.
    # Snapshot the committed *Variants.java files BEFORE the generator overwrites them,
    # so the post-generator diff below has something to compare against.
    - cp -r ewt.api/src/test/java/dev/equo/ewt/support/variants ewt.api/src/test/java/dev/equo/ewt/support/variants.snapshot
    - rm -f generator/build/pregeneration_index.dart.ts
    # finalizedBy in generator/build.gradle.kts automatically runs :widgets:ffigen and
    # :ewt.api:jextract after the generator finishes — no need to call them separately.
    # `2>&1 | tee` captures the combined output so the diagnostics check below can grep
    # for `warn:` lines emitted by generator/lib/diagnostics.dart. `pipefail` propagates
    # gradle's exit code past `tee` — without it a failing gradle would ride green here.
    - |
      set -o pipefail
      ./gradlew :generator:generator 2>&1 | tee generate.log
    # (1) Enforce that committed *Variants.java files match generator output exactly.
    # WidgetVariantsRegistry.java stays gitignored (monolithic aggregator, removal
    # tracked in #55) so exclude it. Without this check, a hand-edited file would
    # ride green: `needs: generate` overwrites the runner's checkout with these
    # artifacts before the downstream test job compiles.
    - |
      if ! diff -r --exclude=WidgetVariantsRegistry.java \
                    ewt.api/src/test/java/dev/equo/ewt/support/variants.snapshot \
                    ewt.api/src/test/java/dev/equo/ewt/support/variants; then
        echo "================================================================"
        echo "ERROR: committed *Variants.java drift from generator output."
        echo "Regenerate locally and amend/commit the diff:"
        echo "  rm -f generator/build/pregeneration_index.dart.ts"
        echo "  ./gradlew :generator:generator"
        echo "  git add ewt.api/src/test/java/dev/equo/ewt/support/variants/"
        echo "  git commit --amend --no-edit"
        echo "================================================================"
        exit 1
      fi
    - rm -rf ewt.api/src/test/java/dev/equo/ewt/support/variants.snapshot
    # (2) Byte-compare the 6 monolithic gitignored outputs against the frozen
    # references under generator/test/snapshots/. Catches emitter regressions that
    # would silently change bytes for the fixed set of monolithic files. Update the
    # references with `dart run tool/update_snapshots.dart` when the change is intentional.
    - |
      diverged=0
      for pair in \
          "widgets/src/factories.h:factories.h" \
          "widgets/src/objects.h:objects.h" \
          "widgets/src/typedefs.h:typedefs.h" \
          "widgets/lib/factories_gen.dart:factories_gen.dart" \
          "widgets/lib/subwidgets.dart:subwidgets_widgets.dart" \
          "generator/lib/subwidgets.dart:subwidgets_generator.dart"; do
        actual="${pair%%:*}"
        snap="generator/test/snapshots/${pair##*:}"
        if ! diff -q "$actual" "$snap" > /dev/null 2>&1; then
          echo "ERROR: $actual diverged from $snap"
          diverged=1
        fi
      done
      if [ $diverged -ne 0 ]; then
        echo "================================================================"
        echo "Run \`(cd generator && dart run tool/update_snapshots.dart)\` if intentional."
        echo "================================================================"
        exit 1
      fi
    # (3) Committed generator outputs (per-widget Java builders + web decoder) must
    # match the current run. Catches hand-edits to ewt.api/src/main/java/dev/equo/ewt
    # or widgets_web/lib/factories_web_gen.dart. `-c safe.directory=*` bypasses git's
    # ownership guard, which fires because the k8s runner's init container writes the
    # checkout under one UID while the job runs as another.
    - |
      git -c safe.directory=* status --porcelain -- \
          ewt.api/src/main/java/dev/equo/ewt \
          widgets_web/lib/factories_web_gen.dart > committed-drift.log
      if [ -s committed-drift.log ]; then
        echo "================================================================"
        echo "ERROR: committed generator outputs diverged from generator run:"
        cat committed-drift.log
        echo "Regenerate locally and commit the diff."
        echo "================================================================"
        exit 1
      fi
      rm -f committed-drift.log
    # (4) Diagnostics smoke check: the generator must surface silent-skip widgets via
    # `warn:` on stderr (see generator/lib/diagnostics.dart). If this ever stops firing,
    # either the diagnostics module got unwired OR every widget in the index became
    # supportable — in the second case, update this expectation.
    - |
      if ! grep -q 'warn:' generate.log; then
        echo "ERROR: expected 'warn:' lines from generator/lib/diagnostics.dart in generator output"
        exit 1
      fi
      rm -f generate.log
  artifacts:
    paths:
      - widgets/src/factories.h
      - widgets/src/objects.h
      - widgets/src/typedefs.h
      - widgets/lib/factories_gen.dart
      - widgets/lib/subwidgets.dart
      - generator/lib/subwidgets.dart
      - widgets/lib/widgets_bindings_generated.dart
      - ewt.api/src/main/java/dev/equo/ewt/ffm/
      - ewt.api/src/test/java/dev/equo/ewt/support/variants/
    expire_in: 1 week

coverage:commit:
  stage: check
  image: $FLUTTER_IMAGE_TAG
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - (cd "$CI_PROJECT_DIR/generator" && flutter pub get && dart tool/coverage_audit.dart)
    - |
      # On MRs / non-default branches there's nothing to compare or commit — the
      # auto-refresh only runs on $CI_DEFAULT_BRANCH. Short-circuit here so we
      # don't need $GITLAB_PRIVATE_TOKEN, which is a protected variable and thus
      # empty on unprotected feature branches (the API GET below would 401,
      # curl exits 22, and the job fails misleadingly).
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        echo "docs/coverage.md refresh runs only on $CI_DEFAULT_BRANCH; skip compare"
        exit 0
      fi
      GENERATED=$(cat "$CI_PROJECT_DIR/docs/coverage.md")
      CURRENT=$(curl -sf --header "PRIVATE-TOKEN: $GITLAB_PRIVATE_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/files/docs%2Fcoverage.md/raw?ref=$CI_DEFAULT_BRANCH")
      if [ "$GENERATED" = "$CURRENT" ]; then
        echo "docs/coverage.md already up to date"
      else
        ENCODED=$(printf '%s\n' "$GENERATED" | base64 -w 0)
        curl -sf --request PUT \
          --header "PRIVATE-TOKEN: $GITLAB_PRIVATE_TOKEN" \
          --header "Content-Type: application/json" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/files/docs%2Fcoverage.md" \
          --data "{\"branch\":\"$CI_DEFAULT_BRANCH\",\"content\":\"$ENCODED\",\"encoding\":\"base64\",\"commit_message\":\"chore(coverage): refresh docs/coverage.md [skip ci]\"}"
        echo "Refreshed docs/coverage.md"
      fi

# Pure-Dart web decoders: no swt-evolve needed, so this runs on the same Linux image
# alongside the native flutter builds. factories_web_gen.dart is committed (not gitignored)
# so no generate artifact is required.
flutter:test:web:
  stage: flutter
  image: $FLUTTER_IMAGE_TAG
  needs:
    - job: build_docker_image
      optional: true
    - job: release_gate
      optional: true
  script:
    - cd widgets_web && flutter pub get && flutter test

flutter:linux:
  stage: flutter
  image: $FLUTTER_IMAGE_TAG
  needs:
    - generate
    - job: build_docker_image
      optional: true
    - job: release_gate
      optional: true
  script:
    - rm -rf widgets/example/build/linux
    # --no-tree-shake-icons: factories_gen.dart constructs IconData(codePoint, fontFamily)
    # from runtime widget payloads, so icon tree-shaking (enforced since Flutter 3.47 on
    # Linux, already enforced on macOS) will reject the non-const invocations. Keep in sync
    # with the macOS + Windows build commands.
    - cd widgets/example && flutter pub get && flutter build linux --release --no-tree-shake-icons
  artifacts:
    paths:
      - widgets/example/build/linux/
    expire_in: 1 week

flutter:macos:
  extends: .flutter:macos
  # flutter_map (EwtMapView) pulls path_provider, whose macOS native plugin
  # path_provider_foundation fails to link in the example's macOS build (no
  # Podfile → CocoaPods never runs → PathProviderPlugin.register is undefined).
  # macOS is not a current POC target (win32); tolerated so it does not gate
  # merges. Follow-up tracks the real fix (CocoaPods for the example's macOS
  # target); remove this once that lands.
  allow_failure: true
  stage: flutter
  needs:
    - generate
    - job: release_gate
      optional: true
  script:
    - rm -rf widgets/example/build/macos
    - cd widgets/example && flutter pub get && flutter build macos --release --no-tree-shake-icons
  artifacts:
    paths:
      - widgets/example/build/macos/
    expire_in: 1 week

flutter:windows:
  extends: .flutter:windows
  stage: flutter
  needs:
    - generate
    - job: release_gate
      optional: true
  script:
    - rm -rf widgets/example/build/windows
    - cd widgets/example
    - powershell.exe -C "\$env:PATH='c:\\flutter\\bin;' + \$env:PATH; flutter pub get; flutter build windows --release --no-tree-shake-icons"
  artifacts:
    paths:
      - widgets/example/build/windows/
    expire_in: 1 week

# =============================================================================
# TEST STAGE
# =============================================================================

# Hermetic Dart tests for the generator emitter (WidgetGen/EnumGen/Params). Uses the
# minimal fixture in test/fixtures/index_min.dart, so it does NOT depend on `generate`
# — dart test runs the unit suite directly, never invoking `dart run bin/generator.dart`.
#
# Only generation_test.dart runs in CI:
#   - transpiler_test.dart validates bin/transpiler.dart, a one-off Dart→Java migration
#     helper that isn't consumed by EWT's build chain (grep confirms zero call sites
#     outside its own tests + tool/regenerate_fixtures.dart). Kept in the repo as a
#     local dev guardrail (`dart test test/transpiler_test.dart`) but skipped here —
#     it accounts for ~10 min of the wall-clock (18 cold AnalysisContextCollection
#     boots against the Flutter SDK, one per transpile() call).
#   - snapshot_test.dart's three checks moved into the `generate` job above, which
#     already runs the generator (so we avoid a second full run + broaden drift
#     coverage to the committed widget builders). Kept in the repo for local runs.
generator_tests:
  stage: test
  image: $FLUTTER_IMAGE_TAG
  needs:
    - job: build_docker_image
      optional: true
    - job: release_gate
      optional: true
  script:
    - cd generator
    # Rewrite pubspec.lock so it's owned by the current container UID. `dart
    # test` internally calls `touch(pubspec.lock)` (utimes) inside
    # Entrypoint.ensureUpToDate; on runners where the checkout files were left
    # under a different UID than the container process, utimes returns EPERM
    # ("Operation not permitted") and the test run crashes before starting.
    # cp+mv makes the destination inherit the process UID.
    - cp pubspec.lock pubspec.lock.new && mv pubspec.lock.new pubspec.lock
    - dart pub get
    # junitreport converts `dart test`'s JSON reporter into JUnit XML for the
    # GitLab "Tests" tab. tojunit chokes mid-stream on a large generator run and
    # closes the pipe, which broken-pipes `dart test` and fails the job even when
    # every test passed. So buffer the JSON to a file (the exit code still gates
    # the run), then convert best-effort — a tojunit failure leaves an empty
    # report but never fails the job.
    - dart pub global activate junitreport
    - export PATH="$PATH:$HOME/.pub-cache/bin"
    - |
      dart test test/generation_test.dart --reporter json > test-report.json
      rc=$?
      tojunit --output test-results.xml < test-report.json 2>/dev/null || : > test-results.xml
      exit $rc
  artifacts:
    when: always
    reports:
      junit: generator/test-results.xml
    paths:
      - generator/test-results.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'

# JUnit 5 tests for ewt.api (non-native only — @Tag("native") is excluded by
# default; opt in with -DrunNativeTests, see ewt.api/build.gradle.kts). Covers
# NativeLibLoaderTest + EvolveBundleExtractorTest. Needs `generate` for the
# jextract'd FFM sources under ewt.api/src/main/java/dev/equo/ewt/ffm/.
# NOTE: :ewt.api:test does NOT trigger :generator:generator (no dependsOn wire),
# so `generate` still runs exactly once per pipeline — shared with ewt_build.
ewt_api_tests:linux:
  stage: test
  image: $FLUTTER_IMAGE_TAG
  cache: *gradle_cache
  needs:
    - generate
    - job: build_docker_image
      optional: true
    - job: release_gate
      optional: true
  script:
    - ./gradlew :ewt.api:test :ewt.api:jacocoTestReport --no-daemon
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    reports:
      junit: ewt.api/build/test-results/test/*.xml
      coverage_report:
        coverage_format: jacoco
        path: ewt.api/build/reports/jacoco/test/jacocoTestReport.xml
    paths:
      - ewt.api/build/reports/tests/test/
      - ewt.api/build/reports/jacoco/test/html/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'

# Native rendering suite: boots a real Flutter engine under xvfb and mounts every
# widget × variant through it (see docs/adr/0009-native-render-test-harness.md
# and docs/native-tests.md).
#
# SOFT-GATED (allow_failure: true) until the two follow-up buckets are cleared:
#   - ~100 variants fail Immutables required-attr checks (issue #44).
#   - ~60 variants need ancestor scaffolds beyond MaterialApp (Material,
#     DefaultTabController, CupertinoApp, Scaffold) — extend
#     generator/lib/contextual_scaffolds.dart.
# Once the pass count is stable at 647/647 for ~1-2 weeks, drop allow_failure
# and re-add this job to ewt_build.needs to make it a hard merge gate.
ewt_native_render:
  stage: test
  image: $FLUTTER_IMAGE_TAG
  cache: *gradle_cache
  allow_failure: true
  needs:
    - generate
    - flutter:linux
    - ewt_api_tests:linux
    - job: build_docker_image
      optional: true
    - job: release_gate
      optional: true
  timeout: 15m
  parallel:
    matrix:
      - EWT_SHARD_INDEX: ["0", "1", "2", "3"]
  variables:
    EWT_SHARD_COUNT: "4"
  # -DskipFlutterBuild: the `flutter:linux` needs dep already downloaded
  # widgets/example/build/linux/ into the workspace, so copyNativeLibs /
  # copyFlutterData can read the built bundle directly. Without this flag
  # `buildFlutter` re-runs from scratch (~2.5 min) because it sets
  # outputs.upToDateWhen { false } in ewt.api/build.gradle.kts.
  script:
    - xvfb-run -a ./gradlew :ewt.api:test -DrunNativeTests=1 -DskipFlutterBuild
        --tests dev.equo.ewt.NativeRenderSmokeTest
        --tests dev.equo.ewt.WidgetNativeRenderTest
        --no-daemon
  artifacts:
    when: always
    reports:
      junit: ewt.api/build/test-results/test/**/*.xml
    paths:
      - ewt.api/build/reports/tests/test/
      - hs_err_pid*.log
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'

# =============================================================================
# BUILD STAGE
# =============================================================================

# ewt.api is JVM bytecode — cross-platform by nature. We compile once on Linux,
# bundling the flutter artifacts from all three platforms into their respective JARs.
ewt_build:
  stage: build
  image: $FLUTTER_IMAGE_TAG
  cache: *gradle_cache
  # gate: generator_tests + ewt_api_tests:linux must pass before we build for deploy.
  # ewt_native_render intentionally NOT in this list — see its soft-gate note above.
  needs:
    - generate
    - flutter:linux
    - flutter:macos
    - flutter:windows
    - generator_tests
    - ewt_api_tests:linux
    - job: build_docker_image
      optional: true
    - job: release_gate
      optional: true
  script:
    - ./gradlew :ewt.api:build -Pclassifier=linux -DskipFlutterBuild -DskipNativeTests --no-daemon
    - ./gradlew :ewt.api:build -Pclassifier=macos -DskipFlutterBuild -DskipNativeTests --no-daemon
    - ./gradlew :ewt.api:build -Pclassifier=windows -DskipFlutterBuild -DskipNativeTests --no-daemon
    - ./gradlew generateVersionEnv --no-daemon
  artifacts:
    paths:
      - ewt.api/build/libs/ewt.api-*-linux.jar
      - ewt.api/build/libs/ewt.api-*-macos.jar
      - ewt.api/build/libs/ewt.api-*-windows.jar
      - build/published/version.env
    reports:
      dotenv: build/published/version.env
    expire_in: 1 week

# Resolves the swt-evolve ref ONCE per pipeline and exports it as EVOLVE_REF via dotenv, so every
# ewt_evolve_build:* job (linux/macos/windows) checks out the SAME ref — no cross-OS skew if a new
# release lands mid-pipeline. By default picks the highest v* release tag by version sort (swt-evolve
# uses linear v0.N.0 release tags on GitHub). OVERRIDE: set EVOLVE_REF as a pipeline variable (a tag,
# a branch like main, or a commit SHA) and this job honors it verbatim — skipping the latest-tag
# lookup — so an EWT build can track an unreleased swt-evolve fix without waiting for a release to cut
# a tag. An Evolve-release rebuild (ewt#75) builds EVOLVE_RELEASE_SHA, the swt-evolve commit that
# release was built from: the tag only moves when the default SWT version is released, and this commit
# is on GitHub's main either way. GIT_STRATEGY:none — we don't need the EWT checkout, only an anonymous
# `git ls-remote` against the public GitHub repo.
resolve_evolve_ref:
  stage: check
  # Pin the image (the moving `:latest` tag was republished with an entrypoint that swallows the
  # shell script -> `git: 'sh' is not a git command`) AND clear the entrypoint so the script runs
  # under sh regardless of the image's default entrypoint.
  image:
    name: alpine/git:v2.49.1
    entrypoint: [""]
  needs: []
  variables:
    GIT_STRATEGY: none
  script:
    - |
      if [ -n "${EVOLVE_REF:-}" ]; then
        echo "EVOLVE_REF pre-set to '$EVOLVE_REF' — pinning swt-evolve source to it (skipping latest-tag lookup)"
      elif [ -n "${EVOLVE_RELEASE_SHA:-}" ]; then
        EVOLVE_REF="$EVOLVE_RELEASE_SHA"
        echo "Evolve release ${EVOLVE_RELEASE_VERSION:-?} was built from swt-evolve $EVOLVE_REF — building it"
      else
        EVOLVE_URL="https://github.com/${EVOLVE_PROJECT_PATH}.git"
        EVOLVE_REF=$(git ls-remote --tags --refs "$EVOLVE_URL" 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
        test -n "$EVOLVE_REF" || { echo "No swt-evolve release tag (v*) found at $EVOLVE_URL"; exit 1; }
        echo "Latest swt-evolve release resolved to $EVOLVE_REF"
      fi
      echo "EVOLVE_REF=$EVOLVE_REF" > evolve.env
  artifacts:
    reports:
      dotenv: evolve.env

# Builds the self-contained ewt-evolve jar (EWT toolkit + EwtWidget + SPI provider + the
# combined Evolve/EWT Dart bundle). Needs the sibling swt-evolve at the resolved EVOLVE_REF:
# its flutter-lib (Dart, merged into libapp.so) and its full jar (compiled against + shipped
# to the consumer). Also builds the standalone ewt.api jar + compiles the examples so the
# smoke job can run the packaged app from artifacts alone (no clone, no gradle).
ewt_evolve_build:
  stage: build
  image: $FLUTTER_IMAGE_TAG
  # The Gradle JVM (3 GiB), dart2js for the combined web bundle and the swt-evolve build run in
  # one container that peaked at 5.8 GiB; without a request the scheduler packs it onto a full node
  # and the kubelet evicts it ("The node was low on resource: memory", release 0.1.9).
  variables:
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_MEMORY_REQUEST: 7Gi
  # gate: generator_tests + ewt_api_tests:linux must pass before we build for deploy.
  needs:
    - resolve_evolve_ref   # provides EVOLVE_REF (latest release) via dotenv
    - generate
    - generator_tests
    - ewt_api_tests:linux
    - job: build_docker_image
      optional: true
    - job: release_gate
      optional: true
  # On MRs this is an opt-in manual button (non-blocking) — the integration is heavy and rarely
  # what an MR touches. On main it follows the release_gate button (manual after merge, like
  # ewt_build); on the scheduled release pipeline (NEED_RELEASE) it runs automatically.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - when: on_success
  script:
    - test -n "$EVOLVE_REF" || (echo "EVOLVE_REF empty — resolve_evolve_ref must run first (or set it to pin)"; exit 1)
    # Clone swt-evolve as a clean sibling (../swt-evolve, same parent as this repo). CI is not
    # bound to the local ../../swt-evolve convention: it points both build sides at the clone
    # explicitly — gradle via -PevolveHome, and the Dart via a generated pubspec_overrides.yaml
    # (so the committed evolve-app/pubspec.yaml keeps its local-friendly default untouched).
    - EVOLVE_URL="https://github.com/${EVOLVE_PROJECT_PATH}.git"
    # Fetch tags so a tag EVOLVE_REF resolves; two-step (clone + checkout) also supports a SHA.
    - git clone --filter=blob:none "$EVOLVE_URL" ../swt-evolve
    - git -C ../swt-evolve checkout "$EVOLVE_REF"
    - EVOLVE_ABS="$(cd ../swt-evolve && pwd)"
    # Point the evolve-app Dart at the clone without touching the committed pubspec.yaml.
    - >-
      printf 'dependency_overrides:\n  swtflutter:\n    path: %s/flutter-lib\n'
      "$EVOLVE_ABS" > evolve-app/pubspec_overrides.yaml
    # Build the FULL swt-evolve jar (with its native bridge/engine — NOT -DskipFlutterLib).
    - (cd ../swt-evolve && ./gradlew :swt_native:linux-x86_64Jar --no-daemon)
    # Build the standalone ewt.api jar (so the examples compile via -PuseLocal), the
    # self-contained ewt-evolve jar, and the example classes used by the smoke job.
    - ./gradlew :ewt.api:jar :ewt.api:ewtEvolveJar :examples:compileJava -PuseLocal=true -PevolveHome=../swt-evolve --no-daemon
    # Stage the swt-evolve jar next to the ewt-evolve jar so both travel as artifacts.
    - cp ../swt-evolve/swt_native/build/libs/swt_evolve-linux-x86_64.jar ewt.api/build/libs/
  artifacts:
    paths:
      - ewt.api/build/libs/ewt-evolve-*.jar
      - ewt.api/build/libs/swt_evolve-linux-x86_64.jar
      - examples/build/classes/java/main/
    expire_in: 1 week

# macOS variant of the ewt-evolve build. Same combined-bundle merge, on a macOS runner, producing
# the `macos` classifier jar. The vm-runner ships Flutter (via .flutter:macos) but no guaranteed
# JDK, so install Temurin 22 for the arch the runner reports; gradle derives the swt-evolve jar
# arch from the JVM, so the arch we build here matches the evolveAvailable gate automatically.
ewt_evolve_build:macos:
  extends: .flutter:macos
  stage: build
  needs:
    - resolve_evolve_ref   # provides EVOLVE_REF (latest release) via dotenv
    - job: generate
      optional: true
    - job: release_gate
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    # Isolated-channel publish (PUBLISH_CHANNEL set) is win/linux-only by design: a map add-on
    # pulling path_provider can't link its macOS native plugin without CocoaPods (dropped for
    # weight). Tolerate the macOS build failure so ewt_evolve_p2 still assembles the win/linux p2
    # (it already `needs` macOS as optional). Normal releases keep macOS required.
    - if: '$PUBLISH_CHANNEL'
      allow_failure: true
    - when: on_success
  before_script:
    - !reference [.flutter:macos, before_script]
    # Force SPM globally: swt-evolve and evolve-app link Darwin plugins via Swift Package Manager
    # (swt-evolve dropped CocoaPods). Without this the flutter build falls back to CocoaPods —
    # which we deliberately don't install — and fails. (widgets/example sets this in its pubspec;
    # the projects this job builds don't, so enable it at the config level.)
    - flutter config --enable-swift-package-manager
    # buildCombinedBundle compiles libwidgets.dylib with cmake; the runner has Xcode (flutter
    # macOS builds work) but not cmake and no Homebrew — fetch the Kitware universal build.
    - command -v cmake >/dev/null || { curl -L -o cmake.tar.gz "https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-macos-universal.tar.gz" && tar xzf cmake.tar.gz; }
    - export PATH="$PWD/cmake-3.30.5-macos-universal/CMake.app/Contents/bin:$PATH"
    - JDK_ARCH=$([ "$(uname -m)" = "arm64" ] && echo aarch64 || echo x64)
    - curl -L "https://github.com/adoptium/temurin22-binaries/releases/download/jdk-22.0.2%2B9/OpenJDK22U-jdk_${JDK_ARCH}_mac_hotspot_22.0.2_9.tar.gz" | tar xz
    - export JAVA_HOME="$PWD/jdk-22.0.2+9/Contents/Home"
    - export PATH="$JAVA_HOME/bin:$PATH"
    # macOS sources icudtl.dat from FlutterMacOS.framework (assemble output), so FLUTTER_ROOT is
    # not strictly needed for it, but set it for parity with the other OSes. The prebuilt image
    # (swt-flutter!1272) has Flutter precached under /opt/flutter.
    - export FLUTTER_ROOT="/opt/flutter"
  script:
    - test -n "$EVOLVE_REF" || (echo "EVOLVE_REF empty — resolve_evolve_ref must run first (or set it to pin)"; exit 1)
    - EVOLVE_URL="https://github.com/${EVOLVE_PROJECT_PATH}.git"
    - git clone --filter=blob:none "$EVOLVE_URL" ../swt-evolve
    - git -C ../swt-evolve checkout "$EVOLVE_REF"
    - EVOLVE_ABS="$(cd ../swt-evolve && pwd)"
    - >-
      printf 'dependency_overrides:\n  swtflutter:\n    path: %s/flutter-lib\n'
      "$EVOLVE_ABS" > evolve-app/pubspec_overrides.yaml
    - MAC_ARCH=$([ "$(uname -m)" = "arm64" ] && echo aarch64 || echo x86_64)
    - (cd ../swt-evolve && ./gradlew ":swt_native:macos-${MAC_ARCH}Jar" --no-daemon)
    - ./gradlew :ewt.api:jar -PuseLocal=true -PevolveHome=../swt-evolve --no-daemon
    # One fragment per arch (distinct Bundle-SymbolicName + PlatformFilter via -Parch). -Parch also sets the
    # combined bundle's arch, so each iteration rebuilds App/FlutterMacOS/widgets for that arch, and
    # ewtEvolveJar checks them with lipo. The eclipse POC ships a macOS x64 build, so both are needed.
    - |
      for A in aarch64 x86_64; do
        ./gradlew :ewt.api:ewtEvolveJar -Pclassifier=macos -Parch=$A -PuseLocal=true -PevolveHome=../swt-evolve --no-daemon
      done
    - cp "../swt-evolve/swt_native/build/libs/swt_evolve-macos-${MAC_ARCH}.jar" ewt.api/build/libs/
  artifacts:
    paths:
      - ewt.api/build/libs/ewt-evolve-*-macos-*.jar
      - ewt.api/build/libs/swt_evolve-macos-*.jar
    expire_in: 1 week

# Windows variant. Runner shell is Git Bash; Flutter and gradle run via powershell.exe with PATH
# set (mirrors flutter:windows). Installs Temurin 22 and points FLUTTER_ROOT at c:\flutter so the
# combined bundle sources icudtl.dat from the engine cache (Windows, unlike macOS, needs it).
ewt_evolve_build:windows:
  extends: .flutter:windows
  stage: build
  # This is a long job (rebuilds swt-evolve's flutter-lib + the combined bundle), and the Windows
  # vm-runners are ephemeral/spot: a 60m+ job often has its VM reclaimed mid-run (no_updates_running).
  # resource_group serializes it; retry re-runs it when the VM (not the build) is what failed.
  # Proper fix mirrors swt-flutter: build the flutter-lib once as an artifact, then package with
  # -DskipFlutterLib on a light JDK-only runner so no single Windows job is huge.
  resource_group: windows-ewt-evolve
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
      - api_failure
      - scheduler_failure
  needs:
    - resolve_evolve_ref   # provides EVOLVE_REF (latest release) via dotenv
    - job: generate
      optional: true
    - job: release_gate
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - when: on_success
  before_script:
    - !reference [.flutter:windows, before_script]
    - curl -L -o jdk.zip "https://github.com/adoptium/temurin22-binaries/releases/download/jdk-22.0.2%2B9/OpenJDK22U-jdk_x64_windows_hotspot_22.0.2_9.zip"
    - powershell.exe -C "Expand-Archive -Force jdk.zip -DestinationPath C:\\jdk"
  script:
    - test -n "$EVOLVE_REF" || (echo "EVOLVE_REF empty — resolve_evolve_ref must run first (or set it to pin)"; exit 1)
    - EVOLVE_URL="https://github.com/${EVOLVE_PROJECT_PATH}.git"
    - git clone --filter=blob:none "$EVOLVE_URL" ../swt-evolve
    - git -C ../swt-evolve checkout "$EVOLVE_REF"
    # The runner's shell is WSL (paths like /mnt/c/...). pubspec_overrides is read by the Windows
    # flutter, which can't resolve a /mnt/c path, so convert it to a Windows path with wslpath -m
    # (C:/...). (evolveHome, resolved via powershell Resolve-Path, is already a Windows path.)
    - EVOLVE_ABS="$(wslpath -m "$(cd ../swt-evolve && pwd)")"
    - >-
      printf 'dependency_overrides:\n  swtflutter:\n    path: %s/flutter-lib\n'
      "$EVOLVE_ABS" > evolve-app/pubspec_overrides.yaml
    # JAVA_HOME + FLUTTER_ROOT + PATH set inline per powershell call (each -C is a fresh shell).
    # Pipe gradle through Out-Host so its stdout is a pipe, not a console: run under powershell
    # launched from Git Bash, gradle's native console-handle probe fails ("could not determine if
    # Stdout is a console"). Propagate gradle's exit code so a real failure still fails the job.
    - >-
      powershell.exe -C "\$env:JAVA_HOME='C:\\jdk\\jdk-22.0.2+9'; \$env:FLUTTER_ROOT='c:\\flutter'; \$env:PATH='c:\\flutter\\bin;'+\$env:JAVA_HOME+'\\bin;'+\$env:PATH;
      cd ..\\swt-evolve; \$null | .\\gradlew.bat :swt_native:windows-x86_64Jar --no-daemon 2>&1 | Out-Host; exit \$LASTEXITCODE"
    # Diagnostic + pass evolveHome as an ABSOLUTE Windows path: the relative "../swt-evolve" made
    # gradle's evolveAvailable probe miss the just-built swt-evolve jar on Windows (ewtEvolveJar
    # then isn't registered). pwd -W yields the C:/ form gradle (Java) resolves reliably.
    - ls -la ../swt-evolve/swt_native/build/libs/ || true
    # Resolve the clone's absolute Windows path INSIDE powershell (the job's bash lacks MSYS
    # cygpath / pwd -W). The relative '../swt-evolve' missed gradle's evolveAvailable probe on
    # Windows (mixed \ and / with ..), which left ewtEvolveJar unregistered.
    - >-
      powershell.exe -C "\$env:JAVA_HOME='C:\\jdk\\jdk-22.0.2+9'; \$env:FLUTTER_ROOT='c:\\flutter'; \$env:PATH='c:\\flutter\\bin;'+\$env:JAVA_HOME+'\\bin;'+\$env:PATH;
      \$evolveHome=(Resolve-Path ..\\swt-evolve).Path;
      Write-Host ('DIAG evolveHome=' + \$evolveHome + ' jarExists=' + (Test-Path (Join-Path \$evolveHome 'swt_native\\build\\libs\\swt_evolve-windows-x86_64.jar')));
      \$env:ORG_GRADLE_PROJECT_evolveHome=\$evolveHome;
      \$vswhere='C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\vswhere.exe';
      \$vsPath=if(Test-Path \$vswhere){(& \$vswhere -latest -products * -property installationPath 2>\$null)}else{\$null};
      \$cmakeBin=\$vsPath+'\\Common7\\IDE\\CommonExtensions\\Microsoft\\CMake\\CMake\\bin';
      if(\$vsPath -and (Test-Path (\$cmakeBin+'\\cmake.exe'))){\$env:PATH=\$cmakeBin+';'+\$env:PATH; Write-Host ('DIAG cmake: '+\$cmakeBin)}else{Write-Host 'DIAG cmake not found via vsWhere'};
      \$null | .\\gradlew.bat :ewt.api:jar :ewt.api:ewtEvolveJar -Pclassifier=windows -PuseLocal=true --no-daemon 2>&1 | Out-Host; exit \$LASTEXITCODE"
    - cp ../swt-evolve/swt_native/build/libs/swt_evolve-windows-x86_64.jar ewt.api/build/libs/
  artifacts:
    paths:
      - ewt.api/build/libs/ewt-evolve-*-windows.jar
      - ewt.api/build/libs/swt_evolve-windows-*.jar
    expire_in: 1 week

# Headless smoke of the PRODUCTION 2-jar path: only ewt-evolve + swt-evolve on the classpath,
# no dev.equo.ewt.bundleDir, no Flutter, no clone — the SPI extracts the bundle from the jar.
# Catches silent same-surface drift (a mismatched Evolve version renders nothing, not an error).
# This is a hard gate: publish_ewt_evolve needs it, so a broken integration jar never reaches
# Maven. If the runner's headless GTK/xvfb turns out flaky, revert to allow_failure until fixed.
ewt_evolve_smoke:
  stage: build
  image: $FLUTTER_IMAGE_TAG
  needs:
    - ewt_evolve_build
  script:
    - command -v xvfb-run >/dev/null || (apt-get update && apt-get install -y xvfb) || true
    - rm -rf "$HOME/.equo/ewt"
    - EWT_EVOLVE_JAR=$(ls ewt.api/build/libs/ewt-evolve-*.jar | head -n1)
    - CP="examples/build/classes/java/main:ewt.api/build/libs/swt_evolve-linux-x86_64.jar:${EWT_EVOLVE_JAR}"
    # timeout closes the window → a non-zero exit here is expected; assert on the log instead.
    - >-
      xvfb-run -a timeout 60 java --enable-native-access=ALL-UNNAMED
      -Ddev.equo.swt.mode=desktop -Ddev.equo.swt.crashReport.disabled=true
      -cp "$CP" dev.equo.EvolveEwtButtons > smoke.log 2>&1 || true
    - tail -n 30 smoke.log || true
    - 'grep -q "external app bundle base" smoke.log || { echo "SMOKE FAILED - SPI bundle base line missing"; exit 1; }'
    - >-
      grep -qE "Resource not found|No builder|Invalid ELF|SIGSEGV|ExceptionInInit|combined libwidgets not found|FATAL:|Check failed:|Aborted" smoke.log
      && { echo "SMOKE FAILED - crash marker in log"; exit 1; } || true
    - 'echo "SMOKE OK - bundle discovered via SPI, no crash markers."'
  artifacts:
    when: always
    paths:
      - smoke.log
    expire_in: 1 week

# =============================================================================
# DEPLOY STAGE
# =============================================================================

publish_to_mvn:
  stage: deploy
  image: $FLUTTER_IMAGE_TAG
  needs:
    - ewt_build
  script:
    - ./gradlew :ewt.api:publishAllPlatforms --no-daemon
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'

# Publishes dev.equo:ewt-evolve from the jar built by ewt_evolve_build (no rebuild). The
# publication is registered only when the swt-evolve jar is present, so restore it to the
# sibling path first to satisfy the evolveAvailable gate at configuration time; the file-based
# artifact then uploads the restored ewt-evolve jar without re-running the bundle merge.
publish_ewt_evolve:
  stage: deploy
  image: $FLUTTER_IMAGE_TAG
  needs:
    - ewt_evolve_build
    - ewt_evolve_build:macos
    - ewt_evolve_build:windows
    - ewt_evolve_smoke
  script:
    - mkdir -p ../swt-evolve/swt_native/build/libs
    # evolvePlatform is derived from THIS (linux) runner's JVM → always linux-x86_64, so staging
    # the linux swt-evolve jar satisfies the evolveAvailable gate for all three publishes.
    # -Pclassifier only selects which per-OS ewt-evolve jar (already built as artifacts) uploads.
    - cp ewt.api/build/libs/swt_evolve-linux-x86_64.jar ../swt-evolve/swt_native/build/libs/
    # Sign each per-OS ewt-evolve jar with EQUO's code-signing cert (alias EQUOOVCO — GlobalSign OV,
    # SHA256withRSA, timestamped) via the SAME remote signing service swt-evolve uses: POST the jar
    # to $JAR_SIGN_URL and overwrite it with the signed bytes, so the published Maven artifact is
    # signed. Skips gracefully when the URL isn't set (mirrors swt-flutter's signJars), so dev/MR
    # pipelines without the secret still publish. Requires $JAR_SIGN_URL in this project's CI vars.
    - >-
      if [ -n "$JAR_SIGN_URL" ] && [ "$SKIP_SIGN" != "true" ]; then
        for jar in ewt.api/build/libs/ewt-evolve-*.jar; do
          echo "Signing $jar via signing service...";
          curl -fsS -F "file=@${jar}" "$JAR_SIGN_URL" -o "${jar}.signed" && mv "${jar}.signed" "$jar";
        done;
      else echo "Skipping JAR signing (JAR_SIGN_URL not set or SKIP_SIGN=true)"; fi
    - ./gradlew :ewt.api:publishEwtEvolvePublicationToGitlabRepository -PevolveHome=../swt-evolve --no-daemon
    - ./gradlew :ewt.api:publishEwtEvolvePublicationToGitlabRepository -Pclassifier=macos -Parch=aarch64 -PevolveHome=../swt-evolve --no-daemon
    - ./gradlew :ewt.api:publishEwtEvolvePublicationToGitlabRepository -Pclassifier=macos -Parch=x86_64 -PevolveHome=../swt-evolve --no-daemon
    - ./gradlew :ewt.api:publishEwtEvolvePublicationToGitlabRepository -Pclassifier=windows -PevolveHome=../swt-evolve --no-daemon
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'

upload_to_gcs:
  extends: .gcs_upload
  stage: deploy
  needs:
    - ewt_build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'

# --- p2 distribution (workstream 10 — see ewt-evolve-p2/ + ewt-evolve-p2-distribution-spec.md) ---
# Assemble the CLI-installable p2 repo — ONE combined addon (each per-OS fragment carries BOTH the
# desktop and web bundle + both SPI providers, so it works whichever mode the POC renders). ONE repo,
# pinned to dev.equo.swt.evolve.feat.hybrid.feature.group at the Evolve tag version (per Matias: the CLI
# always installs feat.hybrid, in both modes; its version is the same on every Eclipse line). p2 is
# fail-closed on a mismatched Evolve — a bad refresh keeps the prior working repo. Published to
# <bucket>/ewt-evolve/latest/p2. The p2 publisher is OS-agnostic Java, so this ONE Linux job builds it
# from whatever per-OS fragment artifacts arrived.
ewt_evolve_p2:
  stage: deploy
  image: $FLUTTER_IMAGE_TAG
  needs:
    - resolve_evolve_ref   # provides EVOLVE_REF (the Evolve tag) via dotenv
    - ewt_evolve_build
    - job: ewt_evolve_build:macos
      optional: true
    - job: ewt_evolve_build:windows
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - when: on_success
  variables:
    # Eclipse providing the equinox launcher + p2 publisher apps + platform bundles (to compile the demo
    # ViewPart). Set ECLIPSE_HOME as a CI/CD variable to a baked/cached Eclipse to skip the download.
    # TODO(infra): confirm this pinned Platform URL resolves on the runner, or bake Eclipse into the image.
    ECLIPSE_HOME: ""
    ECLIPSE_PLATFORM_URL: "https://download.eclipse.org/eclipse/downloads/drops4/R-4.33-202409030240/eclipse-platform-4.33-linux-gtk-x86_64.tar.gz"
    # The eclipse POC's Evolve line — used to verify the pin exists before publishing (per Matias).
    # An Evolve-release rebuild verifies against EVOLVE_RELEASE_P2_URLS instead, the lines that release
    # published. latest/p2 follows this line: a release that leaves it out publishes only <version>/p2.
    VERIFY_P2_URL: "https://dl.equo.dev/evolve/2026-06/desktop-hybrid/p2"
    # feat.hybrid pin version. Normally derived from EVOLVE_REF (a vX.Y.Z tag). But when EVOLVE_REF is a
    # branch/SHA (e.g. main) — building EWT against an unreleased swt-evolve whose source already matches
    # a host published under a DIFFERENT version string — set EVOLVE_PIN_VERSION to the published
    # feat.hybrid version the consumer actually runs (e.g. 0.356.0). Left empty, a non-tag EVOLVE_REF
    # auto-resolves the pin to the HIGHEST feat.hybrid already published at VERIFY_P2_URL. Either way the
    # verify grep below still runs — the pin must exist on the POC's line, so this never ships a dud pin.
    EVOLVE_PIN_VERSION: ""
  script:
    - >-
      if [ -z "$ECLIPSE_HOME" ]; then
        curl -fsSL "$ECLIPSE_PLATFORM_URL" -o eclipse.tar.gz && tar xzf eclipse.tar.gz && export ECLIPSE_HOME="$PWD/eclipse";
      fi
    - test -n "$EVOLVE_REF" || { echo "EVOLVE_REF not set (needs resolve_evolve_ref)"; exit 1; }
    # The p2 repositories the pin must be on: the lines an Evolve release published, else the POC line.
    - VERIFY_URLS=$(echo "${EVOLVE_RELEASE_P2_URLS:-$VERIFY_P2_URL}" | tr ',' ' ')
    # Pull the POC line's p2 metadata first — needed to auto-resolve the pin.
    - curl -fsSL "$VERIFY_P2_URL/content.jar" -o evolve-content.jar
    - unzip -o -q evolve-content.jar -d evolve-p2meta
    # Resolve the feat.hybrid pin version (decoupled from the build ref):
    #   1. EVOLVE_PIN_VERSION explicit override wins;
    #   2. an Evolve-release rebuild -> EVOLVE_RELEASE_VERSION, the version that release published;
    #   3. a vX.Y.Z release tag EVOLVE_REF -> that version;
    #   4. a branch/SHA EVOLVE_REF (e.g. main) -> the HIGHEST feat.hybrid published at VERIFY_P2_URL,
    #      since a branch name is not an OSGi version. This lets an EWT build off unreleased swt-evolve
    #      pin the published host the POC actually runs.
    - |
      if [ -n "${EVOLVE_PIN_VERSION:-}" ]; then
        EVOLVE_VERSION="$EVOLVE_PIN_VERSION"
        echo "feat.hybrid pin from EVOLVE_PIN_VERSION: $EVOLVE_VERSION"
      elif [ -n "${EVOLVE_RELEASE_VERSION:-}" ]; then
        EVOLVE_VERSION="$EVOLVE_RELEASE_VERSION"
        echo "feat.hybrid pin from the Evolve release on ${EVOLVE_RELEASE_LINES:-?}: $EVOLVE_VERSION"
      elif echo "$EVOLVE_REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
        EVOLVE_VERSION="${EVOLVE_REF#v}"
        echo "feat.hybrid pin from release tag $EVOLVE_REF: $EVOLVE_VERSION"
      else
        EVOLVE_VERSION=$(grep -oE "dev\.equo\.swt\.evolve\.feat\.hybrid\.feature\.group' version='[0-9][0-9.]*'" evolve-p2meta/content.xml | sed "s/.*version='//; s/'//" | sort -V | tail -1)
        echo "EVOLVE_REF='$EVOLVE_REF' is not a release tag — pinning latest feat.hybrid at $VERIFY_P2_URL: $EVOLVE_VERSION"
      fi
      test -n "$EVOLVE_VERSION" || { echo "Could not determine a feat.hybrid pin version"; exit 1; }
    # FAIL if that feat.hybrid version isn't published on every line checked — a pin nothing can
    # satisfy helps nobody (Matias). Runs for every path above.
    - |
      for url in $VERIFY_URLS; do
        rm -rf verify-p2meta && mkdir verify-p2meta
        curl -fsSL "$url/content.jar" -o verify-content.jar && unzip -o -q verify-content.jar -d verify-p2meta \
          || { echo "Could not read the p2 metadata at $url — aborting"; exit 1; }
        grep -q "dev.equo.swt.evolve.feat.hybrid.feature.group' version='$EVOLVE_VERSION'" verify-p2meta/content.xml \
          || { echo "feat.hybrid $EVOLVE_VERSION not published at $url yet — aborting"; exit 1; }
        echo "feat.hybrid $EVOLVE_VERSION is published at $url"
      done
    # latest/p2 follows VERIFY_P2_URL's line, so a release of other lines does not repin the POCs on it.
    - |
      POC_LINE=$(echo "$VERIFY_P2_URL" | grep -oE '[0-9]{4}-[0-9]{2}' | head -1)
      if [ -z "${EVOLVE_RELEASE_LINES:-}" ] || echo ",$EVOLVE_RELEASE_LINES," | grep -q ",$POC_LINE,"; then
        MOVE_LATEST=true
      else
        MOVE_LATEST=false
        echo "This release did not publish $POC_LINE: latest/p2 stays where it is"
      fi
    - echo "Pinning dev.equo.swt.evolve.feat.hybrid.feature.group [$EVOLVE_VERSION]"
    # Hand the resolved pin to publish_ewt_evolve_p2 so the immutable GCS copy path matches it.
    - printf 'EVOLVE_VERSION=%s\nMOVE_LATEST=%s\n' "$EVOLVE_VERSION" "$MOVE_LATEST" > evolve-pin.env
    # ONE repo carrying every per-OS combined fragment (both bundles); p2 installs the platform match.
    - ./gradlew -p ewt-evolve-p2 assembleP2
        -PewtEvolveJarsDir="$PWD/ewt.api/build/libs"
        -PevolveVersion="$EVOLVE_VERSION" -PeclipseHome="$ECLIPSE_HOME" --no-daemon
  artifacts:
    paths:
      - ewt-evolve-p2/build/p2-repo/
    reports:
      dotenv: evolve-pin.env
    expire_in: 1 week

# =============================================================================
# RELEASE STAGE
# =============================================================================

# Publish the ONE assembled p2 repo to <bucket>/ewt-evolve/latest/p2 (served at
# https://dl.equo.dev/ewt/ewt-evolve/latest/p2 — the fixed URL hard-coded in the CLI catalog). A failed
# build never reaches this job, so latest/ is only ever overwritten by a good build. Also keeps an
# immutable per-Evolve-version copy. Reuses .gcs_upload's gcloud auth.
publish_ewt_evolve_p2:
  extends: .gcs_upload
  stage: release
  needs:
    - resolve_evolve_ref
    - ewt_evolve_p2
  variables:
    P2_BUCKET: "gs://equo-ewt/ewt-evolve"   # served at https://dl.equo.dev/ewt/ewt-evolve
  script:
    - test -n "$P2_BUCKET" || { echo "P2_BUCKET empty — skipping p2 publish"; exit 0; }
    - REPO="ewt-evolve-p2/build/p2-repo"
    - test -d "$REPO" || { echo "no p2 repo (assembly skipped?)"; exit 0; }
    # Prefer the pin resolved by ewt_evolve_p2 (dotenv) so the immutable copy path matches the actual
    # feat.hybrid pin; fall back to the ref-derived version for a plain released tag.
    - EVOLVE_VERSION="${EVOLVE_VERSION:-${EVOLVE_REF#v}}"
    # Isolated channel (opt-in): when PUBLISH_CHANNEL is set (e.g. "halliburton"), publish the
    # assembled p2 to a SINGLE dedicated path $P2_BUCKET/$PUBLISH_CHANNEL/p2 and touch nothing
    # else — not the immutable <version>/p2, and crucially NOT latest/p2. Lets a win/linux-only
    # build (e.g. the flutter_map map add-on, whose macOS fragment can't link without CocoaPods)
    # reach exactly one POC without the latest/ rsync -d stripping the macOS fragment every other
    # POC consumes. Unset = default behaviour, UNCHANGED (immutable <version>/p2 + latest/p2).
    - |
      if [ -n "$PUBLISH_CHANNEL" ]; then
        echo "== ISOLATED publish → $P2_BUCKET/$PUBLISH_CHANNEL/p2 (skipping versioned + latest) =="
        gsutil -m -h "Cache-Control:no-cache" rsync -r -d "$REPO" "$P2_BUCKET/$PUBLISH_CHANNEL/p2"
        exit 0
      fi
    - echo "== publishing → $P2_BUCKET/latest/p2 (+ immutable $EVOLVE_VERSION) =="
    - gsutil -m -h "Cache-Control:no-cache" rsync -r -d "$REPO" "$P2_BUCKET/$EVOLVE_VERSION/p2"
    # ewt_evolve_p2 decides (MOVE_LATEST): an Evolve release that left the POC line out keeps latest/p2.
    - |
      if [ "${MOVE_LATEST:-true}" = "true" ]; then
        gsutil -m -h "Cache-Control:no-cache" rsync -r -d "$REPO" "$P2_BUCKET/latest/p2"
      else
        echo "latest/p2 left as it is: this Evolve release did not publish the POC line"
      fi
  rules:
    # Evolve-release rebuild (ewt#62 — source "pipeline"): publish the freshly assembled p2
    # automatically (both the immutable <EVOLVE_VERSION>/p2 the CLI resolves and latest/p2). Must
    # precede the default-branch rule, which would otherwise make this a manual button on the trigger.
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'

# An Evolve release refreshes the POCs right away, before this rebuild publishes, so the POCs with
# EWT come back blocked (no EWT build for the new Evolve yet). Once the p2 is out, refresh again: the
# binaries already current are skipped, so only those blocked ones are patched. evolve-pocs runs
# one refresh at a time (resource_group poc-refresh), so this waits for the first one to finish.
trigger_poc_refresh:
  stage: release
  needs:
    - publish_ewt_evolve_p2
  inherit:
    variables: false
  variables:
    POC_REFRESH: "true"
    POC_RUN_TESTS: "false"
  trigger:
    project: maketechnology/equo/evolve-pocs
    branch: main
    forward:
      pipeline_variables: false
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $EVOLVE_RELEASE_VERSION && $PUBLISH_CHANNEL == null'

# =============================================================================
# RELEASE STAGE (cont.)
# =============================================================================

github_release:
  stage: release
  image:
    name: maniator/gh:latest
    entrypoint: [""]
  variables:
    GITHUB_TOKEN: $GITHUB_TOKEN
    GIT_STRATEGY: none
  needs:
    - publish_to_mvn
    - job: upload_to_gcs
      artifacts: false
    - ewt_build
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Releasing v$RELEASE_NEXT"
    - gh release create "v$RELEASE_NEXT"
        --target main
        --generate-notes
        --repo equodev/ewt
        ewt.api/build/libs/ewt.api-*-linux.jar
        ewt.api/build/libs/ewt.api-*-macos.jar
        ewt.api/build/libs/ewt.api-*-windows.jar
    - echo "Release published — clearing NEED_RELEASE"
    - 'curl -sf --request PUT --header "PRIVATE-TOKEN: $GITLAB_PRIVATE_TOKEN"
       "$CI_API_V4_URL/projects/$CI_PROJECT_ID/variables/NEED_RELEASE"
       --form "value=false"'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'
      when: delayed
      start_in: 5 minutes

# Increments the patch version in gradle.properties after a successful release
# so the next cycle doesn't try to release the same version again.
# Uses the GitLab Files API with [skip ci] to avoid triggering another pipeline.
bump_version:
  stage: release
  image: alpine:latest
  needs:
    - job: github_release
      artifacts: false
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl
  script:
    - |
      CURRENT=$(curl -sf --header "PRIVATE-TOKEN: $GITLAB_PRIVATE_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/files/gradle.properties/raw?ref=$CI_DEFAULT_BRANCH")
      CURRENT_VERSION=$(echo "$CURRENT" | grep '^version=' | cut -d= -f2)
      MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
      MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
      PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
      NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
      NEW_CONTENT=$(echo "$CURRENT" | sed "s/^version=.*/version=$NEW_VERSION/")
      ENCODED=$(printf '%s' "$NEW_CONTENT" | base64 -w 0)
      curl -sf --request PUT \
        --header "PRIVATE-TOKEN: $GITLAB_PRIVATE_TOKEN" \
        --header "Content-Type: application/json" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/files/gradle.properties" \
        --data "{\"branch\":\"$CI_DEFAULT_BRANCH\",\"content\":\"$ENCODED\",\"encoding\":\"base64\",\"commit_message\":\"chore: bump version to $NEW_VERSION [skip ci]\"}"
      echo "Bumped $CURRENT_VERSION → $NEW_VERSION"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'

