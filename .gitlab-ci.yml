stages:
  - docker_build
  - check
  - flutter
  - test
  - build
  - deploy
  - release

# --- Release cadence model (mirrors swt-flutter) ---
# Push to main  → ONLY mark_release_needed runs (sets NEED_RELEASE=true).
#                 The release chain is available behind the manual release_gate button.
# Daily schedule → pipeline created ONLY when NEED_RELEASE == "true"; full chain runs automatically.
# Merge requests → release_gate is absent; flutter + build jobs run normally.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        MARK_PIPELINE: "true"

include:
  - '/.ci/shared-templates.yml'

variables:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.console=plain
    -Dorg.gradle.vfs.watch=false
  FLUTTER_SDK: "3.35.7"
  FLUTTER_IMAGE_TAG: $CI_REGISTRY_IMAGE/jdk22.flutter:linux
  JEXTRACT_URL: "https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz"
  # --- EWT ↔ Evolve integration (ewt-evolve jar) ---
  # The combined bundle merges Evolve's Dart (swtflutter) with EWT's into ONE snapshot, so the
  # ewt-evolve jar is tied to a SPECIFIC swt-evolve version: the consumer must run that same
  # swt-evolve jar at runtime. We PIN to a swt-evolve GitHub release tag so every pipeline bakes
  # the identical Evolve Dart (reproducible). Bump deliberately when adopting a newer release —
  # verify the tag builds at FLUTTER_SDK above. The release tags live on GitHub (equodev/swt-evolve),
  # NOT the GitLab dev repo (which carries different versioning), so CI clones GitHub below.
  EVOLVE_REF: "2cf56e6b274dfb5cb4ff3cdd92b9158e1bf7ed31"
  # Public GitHub repo that publishes swt-evolve releases — cloned anonymously over HTTPS (no
  # token, no allowlist). Also a full source mirror (flutter-lib + swt_native), so it builds.
  EVOLVE_PROJECT_PATH: "equodev/swt-evolve"

build_docker_image:
  stage: docker_build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$CI_IMAGE'
    # Rebuild the image inside MRs that change the Dockerfile OR the Flutter
    # version (FLUTTER_SDK lives in this file and is baked into the image at build
    # time), so the MR validates the image (and bootstraps a new tag) instead of
    # failing to pull a tag that only main would ever build — or silently running
    # on a stale Flutter version.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths:
          - .docker/Dockerfile
          - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        paths:
          - .docker/Dockerfile
          - .gitlab-ci.yml
        compare_to: $CI_COMMIT_SHA^
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --pull --build-arg FLUTTER_VERSION=$FLUTTER_SDK --build-arg JEXTRACT_URL=$JEXTRACT_URL -f .docker/Dockerfile -t "$FLUTTER_IMAGE_TAG" .
    - docker push "$FLUTTER_IMAGE_TAG"

# Runs on every push to main. Records that a release is pending so the next
# scheduled run triggers the full release chain.
mark_release_needed:
  stage: check
  image: alpine/curl:latest
  needs: []
  variables:
    GIT_STRATEGY: none
  script:
    - 'curl -sf --request PUT --header "PRIVATE-TOKEN: $GITLAB_PRIVATE_TOKEN"
       "$CI_API_V4_URL/projects/${CI_PROJECT_ID}/variables/NEED_RELEASE"
       --form "value=true"'
  rules:
    - if: '$MARK_PIPELINE == "true"'

# Manual button on master pipelines. Clicking it unblocks the flutter/build chain
# so the full release runs in THIS pipeline instead of waiting for the next schedule.
# On scheduled release pipelines this job is absent and the chain runs automatically.
release_gate:
  stage: check
  image: alpine:latest
  needs: []
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Release gate opened — running the release chain in this pipeline."
  rules:
    - if: '$MARK_PIPELINE == "true"'
      when: manual
      allow_failure: true

# Regenerates all gitignored monolithic artifacts from generation_index.dart.
# flutter:* and ewt_build download these artifacts via `needs` so they never
# need the generator toolchain themselves (critical for macOS/Windows VM runners).
generate:
  stage: flutter
  image: $FLUTTER_IMAGE_TAG
  needs:
    - job: build_docker_image
      optional: true
    - job: release_gate
      optional: true
  script:
    # subwidgets.dart is gitignored but imported by generation_index.dart; the pregeneration
    # step that writes it is cached against pregeneration_index.dart.ts. Delete the cache so
    # it always regenerates subwidgets.dart before the main generator run.
    - rm -f generator/build/pregeneration_index.dart.ts
    # finalizedBy in generator/build.gradle.kts automatically runs :widgets:ffigen and
    # :ewt.api:jextract after the generator finishes — no need to call them separately.
    - ./gradlew :generator:generator
  artifacts:
    paths:
      - widgets/src/factories.h
      - widgets/src/objects.h
      - widgets/src/typedefs.h
      - widgets/lib/factories_gen.dart
      - widgets/lib/subwidgets.dart
      - generator/lib/subwidgets.dart
      - widgets/lib/widgets_bindings_generated.dart
      - ewt.api/src/main/java/dev/equo/ewt/ffm/
    expire_in: 1 week

coverage:commit:
  stage: check
  image: $FLUTTER_IMAGE_TAG
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - (cd "$CI_PROJECT_DIR/generator" && flutter pub get && dart tool/coverage_audit.dart)
    - |
      GENERATED=$(cat "$CI_PROJECT_DIR/docs/coverage.md")
      CURRENT=$(curl -sf --header "PRIVATE-TOKEN: $GITLAB_PRIVATE_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/files/docs%2Fcoverage.md/raw?ref=$CI_DEFAULT_BRANCH")
      if [ "$GENERATED" = "$CURRENT" ]; then
        echo "docs/coverage.md already up to date"
      elif [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        echo "docs/coverage.md is out of date; it will be refreshed once this lands on $CI_DEFAULT_BRANCH"
      else
        ENCODED=$(printf '%s\n' "$GENERATED" | base64 -w 0)
        curl -sf --request PUT \
          --header "PRIVATE-TOKEN: $GITLAB_PRIVATE_TOKEN" \
          --header "Content-Type: application/json" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/files/docs%2Fcoverage.md" \
          --data "{\"branch\":\"$CI_DEFAULT_BRANCH\",\"content\":\"$ENCODED\",\"encoding\":\"base64\",\"commit_message\":\"chore(coverage): refresh docs/coverage.md [skip ci]\"}"
        echo "Refreshed docs/coverage.md"
      fi

# Pure-Dart web decoders: no swt-evolve needed, so this runs on the same Linux image
# alongside the native flutter builds. factories_web_gen.dart is committed (not gitignored)
# so no generate artifact is required.
flutter:test:web:
  stage: flutter
  image: $FLUTTER_IMAGE_TAG
  needs:
    - job: build_docker_image
      optional: true
    - job: release_gate
      optional: true
  script:
    - cd widgets_web && flutter pub get && flutter test

flutter:linux:
  stage: flutter
  image: $FLUTTER_IMAGE_TAG
  needs:
    - generate
    - job: build_docker_image
      optional: true
    - job: release_gate
      optional: true
  script:
    - rm -rf widgets/example/build/linux
    - cd widgets/example && flutter pub get && flutter build linux --release
  artifacts:
    paths:
      - widgets/example/build/linux/
    expire_in: 1 week

flutter:macos:
  extends: .flutter:macos
  stage: flutter
  needs:
    - generate
    - job: release_gate
      optional: true
  script:
    - rm -rf widgets/example/build/macos
    - cd widgets/example && flutter pub get && flutter build macos --release --no-tree-shake-icons
  artifacts:
    paths:
      - widgets/example/build/macos/
    expire_in: 1 week

flutter:windows:
  extends: .flutter:windows
  stage: flutter
  needs:
    - generate
    - job: release_gate
      optional: true
  script:
    - rm -rf widgets/example/build/windows
    - cd widgets/example
    - powershell.exe -C "\$env:PATH='c:\\flutter\\bin;' + \$env:PATH; flutter pub get; flutter build windows --release"
  artifacts:
    paths:
      - widgets/example/build/windows/
    expire_in: 1 week

# =============================================================================
# TEST STAGE
# =============================================================================

# Hermetic Dart tests for the generator (WidgetGen/EnumGen/Params + Dart→Java
# snapshot transpiler). Uses the minimal fixture in test/fixtures/index_min.dart,
# so it does NOT depend on `generate` — dart test runs the unit suite directly,
# never invoking `dart run bin/generator.dart`.
generator_tests:
  stage: test
  image: $FLUTTER_IMAGE_TAG
  needs:
    - job: build_docker_image
      optional: true
    - job: release_gate
      optional: true
  script:
    - cd generator
    - dart pub get
    # junitreport converts `dart test`'s JSON reporter into JUnit XML for the
    # GitLab "Tests" tab. If the runner can't reach pub.dev, drop the pipe and
    # run `dart test --reporter expanded` — the exit code still gates the job.
    - dart pub global activate junitreport
    - export PATH="$PATH:$HOME/.pub-cache/bin"
    - dart test --reporter json | tojunit --output test-results.xml
  artifacts:
    when: always
    reports:
      junit: generator/test-results.xml
    paths:
      - generator/test-results.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'

# JUnit 5 tests for ewt.api (non-native only — @Tag("native") is excluded by
# default; opt in with -DrunNativeTests, see ewt.api/build.gradle.kts). Covers
# NativeLibLoaderTest + EvolveBundleExtractorTest. Needs `generate` for the
# jextract'd FFM sources under ewt.api/src/main/java/dev/equo/ewt/ffm/.
# NOTE: :ewt.api:test does NOT trigger :generator:generator (no dependsOn wire),
# so `generate` still runs exactly once per pipeline — shared with ewt_build.
ewt_api_tests:linux:
  stage: test
  image: $FLUTTER_IMAGE_TAG
  needs:
    - generate
    - job: build_docker_image
      optional: true
    - job: release_gate
      optional: true
  script:
    - ./gradlew :ewt.api:test :ewt.api:jacocoTestReport --no-daemon
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    reports:
      junit: ewt.api/build/test-results/test/*.xml
      coverage_report:
        coverage_format: jacoco
        path: ewt.api/build/reports/jacoco/test/jacocoTestReport.xml
    paths:
      - ewt.api/build/reports/tests/test/
      - ewt.api/build/reports/jacoco/test/html/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'

# =============================================================================
# BUILD STAGE
# =============================================================================

# ewt.api is JVM bytecode — cross-platform by nature. We compile once on Linux,
# bundling the flutter artifacts from all three platforms into their respective JARs.
ewt_build:
  stage: build
  image: $FLUTTER_IMAGE_TAG
  # gate: generator_tests + ewt_api_tests:linux must pass before we build for deploy.
  needs:
    - generate
    - flutter:linux
    - flutter:macos
    - flutter:windows
    - generator_tests
    - ewt_api_tests:linux
    - job: build_docker_image
      optional: true
    - job: release_gate
      optional: true
  script:
    - ./gradlew :ewt.api:build -Pclassifier=linux -DskipFlutterBuild -DskipNativeTests --no-daemon
    - ./gradlew :ewt.api:build -Pclassifier=macos -DskipFlutterBuild -DskipNativeTests --no-daemon
    - ./gradlew :ewt.api:build -Pclassifier=windows -DskipFlutterBuild -DskipNativeTests --no-daemon
    - ./gradlew generateVersionEnv --no-daemon
  artifacts:
    paths:
      - ewt.api/build/libs/ewt.api-*-linux.jar
      - ewt.api/build/libs/ewt.api-*-macos.jar
      - ewt.api/build/libs/ewt.api-*-windows.jar
      - build/published/version.env
    reports:
      dotenv: build/published/version.env
    expire_in: 1 week

# Builds the self-contained ewt-evolve jar (EWT toolkit + EwtWidget + SPI provider + the
# combined Evolve/EWT Dart bundle). Needs the sibling swt-evolve at the PINNED EVOLVE_REF:
# its flutter-lib (Dart, merged into libapp.so) and its full jar (compiled against + shipped
# to the consumer). Also builds the standalone ewt.api jar + compiles the examples so the
# smoke job can run the packaged app from artifacts alone (no clone, no gradle).
ewt_evolve_build:
  stage: build
  image: $FLUTTER_IMAGE_TAG
  # gate: generator_tests + ewt_api_tests:linux must pass before we build for deploy.
  needs:
    - generate
    - generator_tests
    - ewt_api_tests:linux
    - job: build_docker_image
      optional: true
    - job: release_gate
      optional: true
  # On MRs this is an opt-in manual button (non-blocking) — the integration is heavy and rarely
  # what an MR touches. On main it follows the release_gate button (manual after merge, like
  # ewt_build); on the scheduled release pipeline (NEED_RELEASE) it runs automatically.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - when: on_success
  script:
    - test -n "$EVOLVE_REF" || (echo "EVOLVE_REF must be set (pin a tag/SHA)"; exit 1)
    # Clone swt-evolve as a clean sibling (../swt-evolve, same parent as this repo). CI is not
    # bound to the local ../../swt-evolve convention: it points both build sides at the clone
    # explicitly — gradle via -PevolveHome, and the Dart via a generated pubspec_overrides.yaml
    # (so the committed evolve-app/pubspec.yaml keeps its local-friendly default untouched).
    - EVOLVE_URL="https://github.com/${EVOLVE_PROJECT_PATH}.git"
    # Fetch tags so a tag EVOLVE_REF resolves; two-step (clone + checkout) also supports a SHA.
    - git clone --filter=blob:none "$EVOLVE_URL" ../swt-evolve
    - git -C ../swt-evolve checkout "$EVOLVE_REF"
    - EVOLVE_ABS="$(cd ../swt-evolve && pwd)"
    # Point the evolve-app Dart at the clone without touching the committed pubspec.yaml.
    - >-
      printf 'dependency_overrides:\n  swtflutter:\n    path: %s/flutter-lib\n'
      "$EVOLVE_ABS" > evolve-app/pubspec_overrides.yaml
    # Build the FULL swt-evolve jar (with its native bridge/engine — NOT -DskipFlutterLib).
    - (cd ../swt-evolve && ./gradlew :swt_native:linux-x86_64Jar --no-daemon)
    # Build the standalone ewt.api jar (so the examples compile via -PuseLocal), the
    # self-contained ewt-evolve jar, and the example classes used by the smoke job.
    - ./gradlew :ewt.api:jar :ewt.api:ewtEvolveJar :examples:compileJava -PuseLocal=true -PevolveHome=../swt-evolve --no-daemon
    # Stage the swt-evolve jar next to the ewt-evolve jar so both travel as artifacts.
    - cp ../swt-evolve/swt_native/build/libs/swt_evolve-linux-x86_64.jar ewt.api/build/libs/
  artifacts:
    paths:
      - ewt.api/build/libs/ewt-evolve-*.jar
      - ewt.api/build/libs/swt_evolve-linux-x86_64.jar
      - examples/build/classes/java/main/
    expire_in: 1 week

# macOS variant of the ewt-evolve build. Same combined-bundle merge, on a macOS runner, producing
# the `macos` classifier jar. The vm-runner ships Flutter (via .flutter:macos) but no guaranteed
# JDK, so install Temurin 22 for the arch the runner reports; gradle derives the swt-evolve jar
# arch from the JVM, so the arch we build here matches the evolveAvailable gate automatically.
ewt_evolve_build:macos:
  extends: .flutter:macos
  stage: build
  needs:
    - job: generate
      optional: true
    - job: release_gate
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - when: on_success
  before_script:
    - !reference [.flutter:macos, before_script]
    # Force SPM globally: swt-evolve and evolve-app link Darwin plugins via Swift Package Manager
    # (swt-evolve dropped CocoaPods). Without this the flutter build falls back to CocoaPods —
    # which we deliberately don't install — and fails. (widgets/example sets this in its pubspec;
    # the projects this job builds don't, so enable it at the config level.)
    - flutter config --enable-swift-package-manager
    # buildCombinedBundle compiles libwidgets.dylib with cmake; the runner has Xcode (flutter
    # macOS builds work) but not cmake and no Homebrew — fetch the Kitware universal build.
    - command -v cmake >/dev/null || { curl -L -o cmake.tar.gz "https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-macos-universal.tar.gz" && tar xzf cmake.tar.gz; }
    - export PATH="$PWD/cmake-3.30.5-macos-universal/CMake.app/Contents/bin:$PATH"
    - JDK_ARCH=$([ "$(uname -m)" = "arm64" ] && echo aarch64 || echo x64)
    - curl -L "https://github.com/adoptium/temurin22-binaries/releases/download/jdk-22.0.2%2B9/OpenJDK22U-jdk_${JDK_ARCH}_mac_hotspot_22.0.2_9.tar.gz" | tar xz
    - export JAVA_HOME="$PWD/jdk-22.0.2+9/Contents/Home"
    - export PATH="$JAVA_HOME/bin:$PATH"
    # macOS sources icudtl.dat from FlutterMacOS.framework (assemble output), so FLUTTER_ROOT is
    # not strictly needed for it, but set it for parity with the other OSes.
    - export FLUTTER_ROOT="$HOME/flutter"
  script:
    - test -n "$EVOLVE_REF" || (echo "EVOLVE_REF must be set (pin a tag/SHA)"; exit 1)
    - EVOLVE_URL="https://github.com/${EVOLVE_PROJECT_PATH}.git"
    - git clone --filter=blob:none "$EVOLVE_URL" ../swt-evolve
    - git -C ../swt-evolve checkout "$EVOLVE_REF"
    - EVOLVE_ABS="$(cd ../swt-evolve && pwd)"
    - >-
      printf 'dependency_overrides:\n  swtflutter:\n    path: %s/flutter-lib\n'
      "$EVOLVE_ABS" > evolve-app/pubspec_overrides.yaml
    - MAC_ARCH=$([ "$(uname -m)" = "arm64" ] && echo aarch64 || echo x86_64)
    - (cd ../swt-evolve && ./gradlew ":swt_native:macos-${MAC_ARCH}Jar" --no-daemon)
    - ./gradlew :ewt.api:jar :ewt.api:ewtEvolveJar -Pclassifier=macos -PuseLocal=true -PevolveHome=../swt-evolve --no-daemon
    - cp "../swt-evolve/swt_native/build/libs/swt_evolve-macos-${MAC_ARCH}.jar" ewt.api/build/libs/
  artifacts:
    paths:
      - ewt.api/build/libs/ewt-evolve-*-macos.jar
      - ewt.api/build/libs/swt_evolve-macos-*.jar
    expire_in: 1 week

# Windows variant. Runner shell is Git Bash; Flutter and gradle run via powershell.exe with PATH
# set (mirrors flutter:windows). Installs Temurin 22 and points FLUTTER_ROOT at c:\flutter so the
# combined bundle sources icudtl.dat from the engine cache (Windows, unlike macOS, needs it).
ewt_evolve_build:windows:
  extends: .flutter:windows
  stage: build
  # This is a long job (rebuilds swt-evolve's flutter-lib + the combined bundle), and the Windows
  # vm-runners are ephemeral/spot: a 60m+ job often has its VM reclaimed mid-run (no_updates_running).
  # resource_group serializes it; retry re-runs it when the VM (not the build) is what failed.
  # Proper fix mirrors swt-flutter: build the flutter-lib once as an artifact, then package with
  # -DskipFlutterLib on a light JDK-only runner so no single Windows job is huge.
  resource_group: windows-ewt-evolve
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
      - api_failure
      - scheduler_failure
  needs:
    - job: generate
      optional: true
    - job: release_gate
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - when: on_success
  before_script:
    - !reference [.flutter:windows, before_script]
    - curl -L -o jdk.zip "https://github.com/adoptium/temurin22-binaries/releases/download/jdk-22.0.2%2B9/OpenJDK22U-jdk_x64_windows_hotspot_22.0.2_9.zip"
    - powershell.exe -C "Expand-Archive -Force jdk.zip -DestinationPath C:\\jdk"
  script:
    - test -n "$EVOLVE_REF" || (echo "EVOLVE_REF must be set (pin a tag/SHA)"; exit 1)
    - EVOLVE_URL="https://github.com/${EVOLVE_PROJECT_PATH}.git"
    - git clone --filter=blob:none "$EVOLVE_URL" ../swt-evolve
    - git -C ../swt-evolve checkout "$EVOLVE_REF"
    # The runner's shell is WSL (paths like /mnt/c/...). pubspec_overrides is read by the Windows
    # flutter, which can't resolve a /mnt/c path, so convert it to a Windows path with wslpath -m
    # (C:/...). (evolveHome, resolved via powershell Resolve-Path, is already a Windows path.)
    - EVOLVE_ABS="$(wslpath -m "$(cd ../swt-evolve && pwd)")"
    - >-
      printf 'dependency_overrides:\n  swtflutter:\n    path: %s/flutter-lib\n'
      "$EVOLVE_ABS" > evolve-app/pubspec_overrides.yaml
    # JAVA_HOME + FLUTTER_ROOT + PATH set inline per powershell call (each -C is a fresh shell).
    # Pipe gradle through Out-Host so its stdout is a pipe, not a console: run under powershell
    # launched from Git Bash, gradle's native console-handle probe fails ("could not determine if
    # Stdout is a console"). Propagate gradle's exit code so a real failure still fails the job.
    - >-
      powershell.exe -C "\$env:JAVA_HOME='C:\\jdk\\jdk-22.0.2+9'; \$env:FLUTTER_ROOT='c:\\flutter'; \$env:PATH='c:\\flutter\\bin;'+\$env:JAVA_HOME+'\\bin;'+\$env:PATH;
      cd ..\\swt-evolve; \$null | .\\gradlew.bat :swt_native:windows-x86_64Jar --no-daemon 2>&1 | Out-Host; exit \$LASTEXITCODE"
    # Diagnostic + pass evolveHome as an ABSOLUTE Windows path: the relative "../swt-evolve" made
    # gradle's evolveAvailable probe miss the just-built swt-evolve jar on Windows (ewtEvolveJar
    # then isn't registered). pwd -W yields the C:/ form gradle (Java) resolves reliably.
    - ls -la ../swt-evolve/swt_native/build/libs/ || true
    # Resolve the clone's absolute Windows path INSIDE powershell (the job's bash lacks MSYS
    # cygpath / pwd -W). The relative '../swt-evolve' missed gradle's evolveAvailable probe on
    # Windows (mixed \ and / with ..), which left ewtEvolveJar unregistered.
    - >-
      powershell.exe -C "\$env:JAVA_HOME='C:\\jdk\\jdk-22.0.2+9'; \$env:FLUTTER_ROOT='c:\\flutter'; \$env:PATH='c:\\flutter\\bin;'+\$env:JAVA_HOME+'\\bin;'+\$env:PATH;
      \$evolveHome=(Resolve-Path ..\\swt-evolve).Path;
      Write-Host ('DIAG evolveHome=' + \$evolveHome + ' jarExists=' + (Test-Path (Join-Path \$evolveHome 'swt_native\\build\\libs\\swt_evolve-windows-x86_64.jar')));
      \$env:ORG_GRADLE_PROJECT_evolveHome=\$evolveHome;
      \$vswhere='C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\vswhere.exe';
      \$vsPath=if(Test-Path \$vswhere){(& \$vswhere -latest -products * -property installationPath 2>\$null)}else{\$null};
      \$cmakeBin=\$vsPath+'\\Common7\\IDE\\CommonExtensions\\Microsoft\\CMake\\CMake\\bin';
      if(\$vsPath -and (Test-Path (\$cmakeBin+'\\cmake.exe'))){\$env:PATH=\$cmakeBin+';'+\$env:PATH; Write-Host ('DIAG cmake: '+\$cmakeBin)}else{Write-Host 'DIAG cmake not found via vsWhere'};
      \$null | .\\gradlew.bat :ewt.api:jar :ewt.api:ewtEvolveJar -Pclassifier=windows -PuseLocal=true --no-daemon 2>&1 | Out-Host; exit \$LASTEXITCODE"
    - cp ../swt-evolve/swt_native/build/libs/swt_evolve-windows-x86_64.jar ewt.api/build/libs/
  artifacts:
    paths:
      - ewt.api/build/libs/ewt-evolve-*-windows.jar
      - ewt.api/build/libs/swt_evolve-windows-*.jar
    expire_in: 1 week

# Headless smoke of the PRODUCTION 2-jar path: only ewt-evolve + swt-evolve on the classpath,
# no dev.equo.ewt.bundleDir, no Flutter, no clone — the SPI extracts the bundle from the jar.
# Catches silent same-surface drift (a mismatched Evolve version renders nothing, not an error).
# This is a hard gate: publish_ewt_evolve needs it, so a broken integration jar never reaches
# Maven. If the runner's headless GTK/xvfb turns out flaky, revert to allow_failure until fixed.
ewt_evolve_smoke:
  stage: build
  image: $FLUTTER_IMAGE_TAG
  needs:
    - ewt_evolve_build
  script:
    - command -v xvfb-run >/dev/null || (apt-get update && apt-get install -y xvfb) || true
    - rm -rf "$HOME/.equo/ewt"
    - EWT_EVOLVE_JAR=$(ls ewt.api/build/libs/ewt-evolve-*.jar | head -n1)
    - CP="examples/build/classes/java/main:ewt.api/build/libs/swt_evolve-linux-x86_64.jar:${EWT_EVOLVE_JAR}"
    # timeout closes the window → a non-zero exit here is expected; assert on the log instead.
    - >-
      xvfb-run -a timeout 60 java --enable-native-access=ALL-UNNAMED
      -Ddev.equo.swt.mode=desktop -Ddev.equo.swt.crashReport.disabled=true
      -cp "$CP" dev.equo.EvolveEwtButtons > smoke.log 2>&1 || true
    - tail -n 30 smoke.log || true
    - 'grep -q "external app bundle base" smoke.log || { echo "SMOKE FAILED - SPI bundle base line missing"; exit 1; }'
    - >-
      grep -qE "Resource not found|No builder|Invalid ELF|SIGSEGV|ExceptionInInit|combined libwidgets not found|FATAL:|Check failed:|Aborted" smoke.log
      && { echo "SMOKE FAILED - crash marker in log"; exit 1; } || true
    - 'echo "SMOKE OK - bundle discovered via SPI, no crash markers."'
  artifacts:
    when: always
    paths:
      - smoke.log
    expire_in: 1 week

# =============================================================================
# DEPLOY STAGE
# =============================================================================

publish_to_mvn:
  stage: deploy
  image: $FLUTTER_IMAGE_TAG
  needs:
    - ewt_build
  script:
    - ./gradlew :ewt.api:publishAllPlatforms --no-daemon
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'

# Publishes dev.equo:ewt-evolve from the jar built by ewt_evolve_build (no rebuild). The
# publication is registered only when the swt-evolve jar is present, so restore it to the
# sibling path first to satisfy the evolveAvailable gate at configuration time; the file-based
# artifact then uploads the restored ewt-evolve jar without re-running the bundle merge.
publish_ewt_evolve:
  stage: deploy
  image: $FLUTTER_IMAGE_TAG
  needs:
    - ewt_evolve_build
    - ewt_evolve_build:macos
    - ewt_evolve_build:windows
    - ewt_evolve_smoke
  script:
    - mkdir -p ../swt-evolve/swt_native/build/libs
    # evolvePlatform is derived from THIS (linux) runner's JVM → always linux-x86_64, so staging
    # the linux swt-evolve jar satisfies the evolveAvailable gate for all three publishes.
    # -Pclassifier only selects which per-OS ewt-evolve jar (already built as artifacts) uploads.
    - cp ewt.api/build/libs/swt_evolve-linux-x86_64.jar ../swt-evolve/swt_native/build/libs/
    # Sign each per-OS ewt-evolve jar with EQUO's code-signing cert (alias EQUOOVCO — GlobalSign OV,
    # SHA256withRSA, timestamped) via the SAME remote signing service swt-evolve uses: POST the jar
    # to $JAR_SIGN_URL and overwrite it with the signed bytes, so the published Maven artifact is
    # signed. Skips gracefully when the URL isn't set (mirrors swt-flutter's signJars), so dev/MR
    # pipelines without the secret still publish. Requires $JAR_SIGN_URL in this project's CI vars.
    - >-
      if [ -n "$JAR_SIGN_URL" ] && [ "$SKIP_SIGN" != "true" ]; then
        for jar in ewt.api/build/libs/ewt-evolve-*.jar; do
          echo "Signing $jar via signing service...";
          curl -fsS -F "file=@${jar}" "$JAR_SIGN_URL" -o "${jar}.signed" && mv "${jar}.signed" "$jar";
        done;
      else echo "Skipping JAR signing (JAR_SIGN_URL not set or SKIP_SIGN=true)"; fi
    - ./gradlew :ewt.api:publishEwtEvolvePublicationToGitlabRepository -PevolveHome=../swt-evolve --no-daemon
    - ./gradlew :ewt.api:publishEwtEvolvePublicationToGitlabRepository -Pclassifier=macos -PevolveHome=../swt-evolve --no-daemon
    - ./gradlew :ewt.api:publishEwtEvolvePublicationToGitlabRepository -Pclassifier=windows -PevolveHome=../swt-evolve --no-daemon
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'

upload_to_gcs:
  extends: .gcs_upload
  stage: deploy
  needs:
    - ewt_build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'

# =============================================================================
# RELEASE STAGE
# =============================================================================

github_release:
  stage: release
  image:
    name: maniator/gh:latest
    entrypoint: [""]
  variables:
    GITHUB_TOKEN: $GITHUB_TOKEN
    GIT_STRATEGY: none
  needs:
    - publish_to_mvn
    - job: upload_to_gcs
      artifacts: false
    - ewt_build
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Releasing v$RELEASE_NEXT"
    - gh release create "v$RELEASE_NEXT"
        --target main
        --generate-notes
        --repo equodev/ewt
        ewt.api/build/libs/ewt.api-*-linux.jar
        ewt.api/build/libs/ewt.api-*-macos.jar
        ewt.api/build/libs/ewt.api-*-windows.jar
    - echo "Release published — clearing NEED_RELEASE"
    - 'curl -sf --request PUT --header "PRIVATE-TOKEN: $GITLAB_PRIVATE_TOKEN"
       "$CI_API_V4_URL/projects/$CI_PROJECT_ID/variables/NEED_RELEASE"
       --form "value=false"'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'
      when: delayed
      start_in: 5 minutes

# Increments the patch version in gradle.properties after a successful release
# so the next cycle doesn't try to release the same version again.
# Uses the GitLab Files API with [skip ci] to avoid triggering another pipeline.
bump_version:
  stage: release
  image: alpine:latest
  needs:
    - job: github_release
      artifacts: false
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl
  script:
    - |
      CURRENT=$(curl -sf --header "PRIVATE-TOKEN: $GITLAB_PRIVATE_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/files/gradle.properties/raw?ref=$CI_DEFAULT_BRANCH")
      CURRENT_VERSION=$(echo "$CURRENT" | grep '^version=' | cut -d= -f2)
      MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
      MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
      PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
      NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
      NEW_CONTENT=$(echo "$CURRENT" | sed "s/^version=.*/version=$NEW_VERSION/")
      ENCODED=$(printf '%s' "$NEW_CONTENT" | base64 -w 0)
      curl -sf --request PUT \
        --header "PRIVATE-TOKEN: $GITLAB_PRIVATE_TOKEN" \
        --header "Content-Type: application/json" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/files/gradle.properties" \
        --data "{\"branch\":\"$CI_DEFAULT_BRANCH\",\"content\":\"$ENCODED\",\"encoding\":\"base64\",\"commit_message\":\"chore: bump version to $NEW_VERSION [skip ci]\"}"
      echo "Bumped $CURRENT_VERSION → $NEW_VERSION"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NEED_RELEASE == "true"'

