name: ewt_evolve_app
description: "EWT-owned combined app for the EWT ↔ SWT Evolve same-surface integration."
# The EWT-owned root of the combined Flutter binary (dependency direction EWT → Evolve):
# it depends on Evolve's flutter-lib (package: swtflutter) AND EWT's widgets, so ONE binary
# contains both Dart trees. Its main() installs the EWT region provider, then runs Evolve's
# arg-driven main(). The Linux runner is Evolve's (flutter_bridge.cc → libflutter_bridge.so,
# what Evolve's Java loads via JNI), copied under linux/.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: "^3.47.5"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: any

  # Evolve (the swt.jar replacement's Flutter side). EWT → Evolve.
  swtflutter:
    path: ../../../swt-evolve/flutter-lib

  # EWT's Flutter widgets (the FFI plugin whose libwidgets.so hosts the build callback).
  widgets:
    path: ../widgets

  # Pure-Dart web decoders (no ffi) for the EWT web path.
  widgets_web:
    path: ../widgets_web

# flutter_map (via EwtMapView in widgets_ext) hard-depends on path_provider, which
# on macOS/iOS federates to path_provider_foundation — a NATIVE Swift plugin that
# needs CocoaPods/SPM to link. swt-evolve dropped CocoaPods, so the macOS build of
# the combined bundle fails with an undefined `PathProviderPlugin.register` symbol.
# Override foundation with a pure-Dart stub (dartPluginClass only, no native
# pluginClass) so it is excluded from the macOS native plugin registrant — no native
# pod to link → macOS builds without CocoaPods. win32/linux/web never use foundation
# (they federate to _windows/_linux/web), so this override is inert there; EwtMapView
# uses NetworkTileProvider and never calls path_provider at runtime.
# NOTE: the macOS/windows CI jobs generate a pubspec_overrides.yaml here for the
# `swtflutter` path; Flutter merges that file ON TOP of these keys (different key),
# so both coexist.
dependency_overrides:
  path_provider_foundation:
    path: ../widgets_ext/tool/path_provider_foundation_stub

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
