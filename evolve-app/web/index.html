<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ewt_evolve_app">

  <link rel="manifest" href="manifest.json">
  <script>
    window.equoCommPort = {{EQUO_COMM_PORT}};
    window.equoCommUrl = "{{EQUO_COMM_URL}}";
    window.evolve = {};
    window.evolve.widgetId = {{EQUO_WIDGETID}};
    window.evolve.widgetName = "{{EQUO_WIDGETNAME}}";
    window.evolve.browserProxy = {{EQUO_BROWSER_PROXY}};
  </script>
  <script>
    // Evolve's frame counter (its own web/index.html carries the same): counts the frames the engine
    // has put on screen. The engine hands each rasterised frame to its display canvases through
    // transferFromImageBitmap, all of one frame's in one task. On the wasm renderer (Skwasm) a pixel
    // read-back shares the surface frames are rasterised on, so Evolve's ImageUtils.toBytes starts one
    // only once every frame already rendered has been shown (FramePresentation); without this counter
    // it does not wait.
    (function () {
      var proto = window.ImageBitmapRenderingContext && ImageBitmapRenderingContext.prototype;
      if (!proto || !proto.transferFromImageBitmap) return;
      var transfer = proto.transferFromImageBitmap;
      var pending = false;
      var waiters = [];
      window.evolve.presentedFrames = 0;
      window.evolve.nextPresentedFrame = function () {
        return new Promise(function (resolve) { waiters.push(resolve); });
      };
      proto.transferFromImageBitmap = function (bitmap) {
        var result = transfer.call(this, bitmap);
        // Only a frame reaching a display canvas; the engine also encodes images on offscreen ones.
        if (bitmap && !pending && this.canvas instanceof HTMLCanvasElement) {
          pending = true;
          queueMicrotask(function () {
            pending = false;
            window.evolve.presentedFrames++;
            var woken = waiters;
            waiters = [];
            for (var i = 0; i < woken.length; i++) woken[i]();
          });
        }
        return result;
      };
    })();
  </script>
  <script>
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, true);
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
